apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-environment-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:ot-central-team/gitops.git'
    targetRevision: HEAD
    path: argocd/prod                 # <── Points ONLY to argocd/prod!
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
