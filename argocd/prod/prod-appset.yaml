apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  generators:
    - list:
        elements:
          - app: python-demo-for-dashboard
  template:
    metadata:
      name: '{{app}}-prod'
    spec:
      project: prod-project
      source:
        repoURL: 'https://github.com/ot-central-team/gitops.git'
        targetRevision: HEAD
        path: helm
        helm:
          valueFiles:
            - values.yaml
            - ../applications/prod/{{app}}-values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: prod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true       # <── TELLS ARGO CD TO AUTO-CREATE THE PROD NAMESPACE!
