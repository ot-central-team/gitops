{{- /* Preview Service — rendered ONLY when strategy: bluegreen.
   The NEW (incoming) ReplicaSet pods register under this Service so you can
   hit them directly for a smoke test BEFORE any user traffic is switched.
   Naming must match rollout.yaml's spec.strategy.blueGreen.previewService.
   Argo Rollouts owns its selector — the controller points it at the
   "preview" ReplicaSet.                                                       */}}
{{- if eq .Values.strategy "bluegreen" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic.fullname" . }}-preview-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "generic.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
{{- end }}