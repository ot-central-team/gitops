{{- /* Argo Rollouts manifest — rendered ONLY when a rollout strategy is set.
   The pod spec is identical to deployment.yaml; the only changes are:
     kind: Rollout  +  spec.strategy.<blueGreen|canary>
  Argo Rollouts (owned by ArgoCD) manages the rollout; Kong receives the
  weighted HTTPRoute updates through the Gateway API traffic plugin.
   App values choose the strategy:  strategy: bluegreen | canary
   ----------------------------------------------------------------------------
   Blue-green:
     - preview pods join `<app>-preview-service` (NO live traffic), so you can
       smoke-test them before (or without) promotion.
     - autoPromotionEnabled: true → auto-promote once Ready (or once
       prePromotionAnalysis passes). false → wait for the "Promote" click.
     - analysis.enabled → prePromotionAnalysis blocks promotion until preview
       passes; postPromotionAnalysis runs after promotion and AUTO-ROLLBACKS
       on failure (abortScaleDownDelaySeconds).
   Canary:
     - stableService and canaryService are managed by Argo Rollouts.
     - the Gateway API plugin updates the HTTPRoute backend weights for each
       setWeight step, so weights are request traffic percentages at Kong.
     - analysis is optional; when enabled it probes the canary Service.
   Rendered via analysistemplate.yaml (<app>-health) whose AnalysisRun jobs
   curl the app's health path.                                        */}}
{{- if or (eq .Values.strategy "bluegreen") (eq .Values.strategy "canary") }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "generic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "generic.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if eq .Values.strategy "bluegreen" }}
  strategy:
    blueGreen:
      # activeService: the Service serving LIVE traffic. Argo Rollouts rewrites
      # its selector to point at the new RS on promotion.
      activeService: {{ include "generic.fullname" . }}-service
      # previewService: the Service only the NEW pods join, so you can
      # smoke-test them before (or without) promotion.
      previewService: {{ include "generic.fullname" . }}-preview-service
      # true: auto-promote once preview pods are Ready (or their
      # prePromotionAnalysis passes). false: wait for a manual Promote click
      # in the Argo Rollouts UI after you've smoke-tested the preview service.
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled | default true }}
      # Safety net: old RS keeps running this long after promotion so a quick
      # "Abort" rolls traffic back instantly. Then old pods scale to zero.
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds | default 60 }}
      {{- if .Values.analysis.enabled }}
      # Gate BEFORE the traffic switch: the AnalysisRun must pass against the
      # PREVIEW service or promotion is BLOCKED (no user traffic ever sees a
      # broken build).
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "generic.fullname" . }}-health
        args:
          - name: service
            value: {{ include "ge neric.fullname" . }}-preview-service
      # Gate AFTER the switch: if the live service regresses, abort and flip
      # traffic back to the old RS (auto-rollback) after abortScaleDownDelaySeconds.
      postPromotionAnalysis:
        templates:
          - templateName: {{ include "generic.fullname" . }}-health
        args:
          - name: service
            value: {{ include "generic.fullname" . }}-service
      # Seconds the new (preview) RS survives AFTER an automatic abort
      # (postPromotionAnalysis failed) before it scales to zero.
      abortScaleDownDelaySeconds: {{ .Values.blueGreen.abortScaleDownDelaySeconds | default 30 }}
      {{- end }}
  {{- else }}
  strategy:
    canary:
      stableService: {{ include "generic.fullname" . }}-service
      canaryService: {{ include "generic.fullname" . }}-canary-service
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute:
              name: {{ include "generic.fullname" . }}
              namespace: {{ .Release.Namespace }}
      {{- /* Explicit step list wins; otherwise render health analysis and
         pauses between traffic shifts. */}}
      {{- if .Values.canary.steps }}
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
      {{- else }}
      steps:
        {{- if .Values.analysis.enabled }}
        - analysis:
            templates:
              - templateName: {{ include "generic.fullname" . }}-health
            args:
              - name: service
                value: {{ include "generic.fullname" . }}-canary-service
        {{- end }}
        - pause:
            duration: {{ .Values.canary.defaultPauseSeconds }}s
      {{- end }}
  {{- end }}
{{- end }}
