{{- /* Argo Rollouts manifest.
   Blue-green: flips the active Service selector on promotion. Service-based,
   works with the ALB as-is, no traffic routing needed.
   Canary: ALB traffic routing. The Rollouts controller injects
   alb.ingress.kubernetes.io/actions.<stable-service> into the app's Ingress
   and shifts the canary/stable weights there as steps progress; the AWS LB
   Controller reconciles them into real target groups. No Gateway API
   provider needed. */}}
{{- if or (eq .Values.strategy "bluegreen") (eq .Values.strategy "canary") }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "generic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "generic.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if eq .Values.strategy "bluegreen" }}
  strategy:
    blueGreen:
      # activeService: the Service serving LIVE traffic. Argo Rollouts rewrites
      # its selector to point at the new RS on promotion.
      activeService: {{ include "generic.fullname" . }}-service
      # Argo calls this field previewService; the actual Service is generic.
      previewService: {{ include "generic.fullname" . }}-candidate-service
      # true: promote once preview pods are Ready. false: wait for Promote.
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled | default true }}
      # Keep the old ReplicaSet briefly after promotion for rollback.
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds | default 60 }}
  {{- else }}
  strategy:
    canary:
      stableService: {{ include "generic.fullname" . }}-service
      canaryService: {{ include "generic.fullname" . }}-candidate-service
      # ALB traffic routing: Rollouts writes the canary/stable weights into
      # the app's Ingress actions annotation (see ingress.yaml). servicePort
      # must match service.port. Verified against the Rollouts ALB docs.
      trafficRouting:
        alb:
          ingress: {{ include "generic.fullname" . }}
          servicePort: {{ .Values.service.port }}
      {{- /* Explicit traffic steps win; otherwise use one pause. */}}
      {{- if .Values.canary.steps }}
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
      {{- else }}
      steps:
        - pause:
            duration: {{ .Values.canary.defaultPauseSeconds }}s
      {{- end }}
  {{- end }}
{{- end }}
