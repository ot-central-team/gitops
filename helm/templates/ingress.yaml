{{- if .Values.ingress.enabled }}
# Kong route for this app. Host-based: add a CNAME `<host> → ALB DNS` at
# your registrar, and Kong + the wildcard cert handle the rest.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "kong" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "generic.fullname" . }}-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}