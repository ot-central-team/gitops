{{- if .Values.route.enabled }}
# Ingress for this app, served by the AWS Load Balancer Controller
# (ingressClassName: alb). Host-based routing: set route.host per app and add
# the DNS record pointing at the ALB.
#
# TLS: the ALB does NOT read Kubernetes TLS secrets. It terminates TLS with an
# ACM certificate, taken either from the
# alb.ingress.kubernetes.io/certificate-arn annotation in route.annotations,
# or automatically via the controller's certificate discovery (it matches an
# ACM cert to the ingress hostname, nothing to configure).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.route.ingressClassName | default "alb" | quote }}
  rules:
    - host: {{ .Values.route.host | quote }}
      http:
        paths:
          - path: {{ .Values.route.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "generic.fullname" . }}-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}
