{{- /* Health AnalysisTemplate — rendered ONLY when analysis.enabled.
   Shared by both strategies (Kong is NOT involved; Argo Rollouts owns it):
     - bluegreen: prePromotionAnalysis hits the PREVIEW service before any
       traffic switch; postPromotionAnalysis hits the ACTIVE service after
       promotion and auto-rollbacks on failure (abortScaleDownDelaySeconds).
     - canary: the analysis step runs before the canary promotes; failure
       aborts the rollout.
   The metric is a plain HTTP GET (curl-style job run by Argo Rollouts) against
   the app's health path. The `service` arg is what makes it dual-use: the
   rollout wires it to `-preview-service` for pre-promotion and `-service`
   for post-promotion.                                                         */}}
{{- if and .Values.analysis.enabled (or (eq .Values.strategy "bluegreen") (eq .Values.strategy "canary")) }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "generic.fullname" . }}-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
spec:
  # args: values are injected by the Rollout's pre/postPromotionAnalysis
  # blocks (see rollout.yaml). `service` flips between preview and active.
  args:
    - name: service             # Service name to curl (e.g. <app>-preview-service)
  metrics:
    - name: health-check
      # interval: how often the check runs while the AnalysisRun is active
      interval: "{{ .Values.analysis.interval }}"
      # count: how many ticks before the AnalysisRun completes
      count: {{ .Values.analysis.count }}
      # failureLimit: healthy failures tolerated before it FAILS (-> abort)
      failureLimit: {{ .Values.analysis.failureLimit }}
      # result[0] = the HTTP status code of the curl
      successCondition: {{ .Values.analysis.successCondition }}
      provider:
        http:
          # The URL, templated with the injected `service` arg.
          # (`{{ printf "{{ args.service }}" }}` keeps Helm from gobbling the
          #  inner Go-template braces that Argo Rollouts resolves at runtime.)
          url: "http://{{ printf "{{ args.service }}" }}:{{ .Values.service.port }}{{ .Values.analysis.http.path }}"
{{- end }}
