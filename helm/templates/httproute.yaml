{{- if .Values.route.httpRoute.enabled }}
# HTTPRoute for this app (Gateway API). OFF by default: this cluster has no
# Kong gateway and no Gateway API provider, so enabling this renders a route
# that attaches to nothing. Kept only for a future Gateway API provider.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.route.annotations | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayRef.name | default "kong" }}
      namespace: {{ .Values.route.gatewayRef.namespace | default "kong" }}
  hostnames:
    - {{ .Values.route.host }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.path | default "/" }}
      backendRefs:
        - name: {{ include "generic.fullname" . }}-service
          port: {{ .Values.service.port }}
          {{- if eq .Values.strategy "canary" }}
          weight: 100
        - name: {{ include "generic.fullname" . }}-candidate-service
          port: {{ .Values.service.port }}
          weight: 0
          {{- end }}
{{- end }}
