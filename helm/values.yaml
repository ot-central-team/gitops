# ============================================================================
# generic-microservice chart — BASE VALUES (shared defaults across ALL apps)
#
# Each app/environment overrides these via Helm value merging:
# ArgoCD's ApplicationSet feeds this file first, then the tenant middle layer,
# then the app file (later wins):
#   values.yaml → ../values/<tenant>/_tenant-defaults.yaml
#             → ../values/<tenant>/<env>/<app>-values.yaml
# Example: dev sets replicaCount: 2, prod sets 3. That per-file override is
# the intended place for environment-specific differences (scaling, etc.).
# ============================================================================

# --- App scaling -----------------------------------------------------------
# Default is 1; per-env values files bump per app (dev=2, prod=3, ...).
replicaCount: 1

# --- Deployment strategy ----------------------------------------------------
# What owns the rollout of this app's pods:
#   "" (empty)  -> plain k8s Deployment (in-place, replace pods)  [default]
#   bluegreen   -> Argo Rollouts blue-green (active + preview, flip on promote)
#   canary      -> NOT usable yet: built for Kong Gateway API traffic splitting,
#                  and there is no Kong in this cluster. Needs an ALB rework.
# When a strategy is set, ArgoCD renders a `kind: Rollout` instead of a
# Deployment.
strategy: ""

# Blue-green knobs (only used when strategy: bluegreen).
blueGreen:
  # Automatically promote the preview pods to live traffic once they're
  # Ready.
  # Set false if you want a manual "Promote" click in the Rollouts UI
  # after you've smoke-tested the candidate service.
  autoPromotionEnabled: true
  # Seconds the old (active) ReplicaSet keeps running AFTER promotion,
  # as an instant-rollback safety net. Then it scales to zero.
  scaleDownDelaySeconds: 60

# Canary knobs (only used when strategy: canary). Currently unusable: the
# canary path was built for Kong's Gateway API traffic plugin, which does
# not exist in this cluster.
canary:
  # Gateway API traffic is controlled by setWeight steps. For example, 20
  # sends approximately 20% of requests to the canary backend.
  # When empty, the chart renders one pause.
  # Example override:
  #   steps:
  #     - setWeight: 20
  #     - pause: { duration: 30s }
  #     - setWeight: 100
  steps: []
  # How long the rollout waits (after stepping) before scaling up / promoting.
  # Ignored if you provide an explicit `steps` list.
  defaultPauseSeconds: 60

# --- Image ----------------------------------------------------------------
image:
  repository: nginx
  # Pin a real tag (git SHA / semver). NEVER 'latest' if you want rollbacks.
  tag: "1.27"
  # Always is REQUIRED while tags are mutable ('latest'): IfNotPresent would
  # cache 'latest' and never re-pull CI's new image. Switch to IfNotPresent
  # the day you pin real immutable tags.
  pullPolicy: Always

# --- Service ---------------------------------------------------------------
# ClusterIP is intentional: only the ALB talks to apps, never clients directly.
service:
  type: ClusterIP
  port: 80            # the port the ALB forwards to
  targetPort: 8080    # the port your app actually listens on in the container

# --- Rendering knobs -------------------------------------------------------
fullnameOverride: ""  # rename the app's objects (defaults to release/App name)
nameOverride: ""      # reserved; usually not needed
podAnnotations: {}

# --- Health probes ---------------------------------------------------------
# OFF by default because every app has its own health path.
# Turn on per app in its values file:
#   probes:
#     enabled: true
#     liveness:
#       path: /healthz
#     readiness:
#       path: /healthz
probes:
  enabled: false
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    enabled: false
    path: /healthz
    failureThreshold: 30
    periodSeconds: 5

# --- Resource requests/limits ----------------------------------------------
# Ask for what the app really needs; tune in the per-env values file.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- Environment variables -------------------------------------------------
# Plain env vars for the container:
#   env:
#     - name: LOG_LEVEL
#       value: info
# Or pull from an existing k8s Secret/ConfigMap (e.g. an ESO-managed secret):
#   envFrom:
#     - secretRef:
#         name: my-app-db
env: []
envFrom: []

# --- Autoscaling (HPA) -----------------------------------------------------
# ON only when an app needs it (scale dev=2..3, prod=3..10, ...).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80   # optional second metric

# --- App ingress (AWS ALB) ---------------------------------------------------
# ON per app to expose it: set host, apply, add the DNS record for the host.
# Served by the AWS Load Balancer Controller (ingressClassName: alb).
# There is no Kong gateway in this cluster.
#
# TLS: the ALB ignores Kubernetes TLS secrets. It terminates with the org
# wildcard ACM cert (*.opstree.dev), attached in route.annotations below.
route:
  enabled: false
  host: myapp.example.com   # <-- set per app: <app>.opstree.dev in prod,
                            #     <app>-<env>.opstree.dev in dev/uat (no tenant)
  path: /
  ingressClassName: alb
  # House defaults: every app joins the shared negd-dev-alb ALB with the org
  # wildcard ACM cert (*.opstree.dev). Override per app only when it needs
  # something different (e.g. its own ALB group or custom health checks).
  # NOTE: hosts must be on opstree.dev (prod: <app>.opstree.dev,
  # dev/uat: <app>-<env>.opstree.dev, no tenant segment). A tyagi.fun host is
  # NOT covered by the org wildcard cert and its TLS would fail.
  annotations:
    alb.ingress.kubernetes.io/group.name: negd-dev-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:724446904294:certificate/60f80f90-a686-4b8d-bdac-d19d199661b9
  # Gateway API HTTPRoute (Kong) stays OFF: no Kong gateway exists here.
  # Kept only for a future Gateway API provider. Do not enable as-is.
  httpRoute:
    enabled: false

# --- ServiceAccount / image pull -------------------------------------------
# One SA per app by default — later you can attach IRSA (role-arn annotation)
# or per-app imagePullSecrets right here.
serviceAccount:
  create: true
  name: ""
  annotations: {}
imagePullSecrets: []

# --- Hardening -------------------------------------------------------------
# Safe defaults: drop Linux capabilities, block privilege escalation.
# The pod still runs as the image's own user; forcing a UID here would
# break images built to run as root, so do that per-app when you control it.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# --- Pod placement (rarely needed) ----------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# --- HA helper: PodDisruptionBudget ----------------------------------------
# ON only for HA apps (replicaCount > 1). Protects against node drains
# taking all replicas down at once.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
