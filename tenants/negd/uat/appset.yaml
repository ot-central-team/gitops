apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: negd-uat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: 'https://github.com/ot-central-team/gitops.git'
        revision: HEAD
        files:
          - path: values/negd/uat/*-values.yaml
  template:
    metadata:
      name: 'negd-uat-{{trimSuffix "-values.yaml" .path.filename}}'
    spec:
      project: negd-uat-project
      source:
        repoURL: 'https://github.com/ot-central-team/gitops.git'
        targetRevision: HEAD
        path: helm
        helm:
          valueFiles:
            - values.yaml
            - ../values/negd/_tenant-defaults.yaml
            - ../{{.path.path}}/{{.path.filename}}
      destination:
        server: https://kubernetes.default.svc
        namespace: negd-uat
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
      ignoreDifferences:
        # Argo Rollouts injects and continuously rewrites Ingress annotations
        # during canary (alb.ingress.kubernetes.io/actions.* carrying the
        # weights, plus its bookkeeping annotation). Without this, ArgoCD
        # self-heal reverts them mid-canary and the weights flap.
        # If weights still flap on the first live canary, confirm the field
        # manager name:
        #   kubectl get ingress <name> -o jsonpath='{.metadata.managedFields[*].manager}'
        - group: networking.k8s.io
          kind: Ingress
          managedFieldsManagers:
            - argo-rollouts
