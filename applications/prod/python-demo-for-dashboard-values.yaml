# ============================================================================
# python-app  —  PROD  overrides
# Base defaults come from  helm/values.yaml ; this file only overrides what
# differs for python-app in PROD. ArgoCD merges: base → this file.
# ============================================================================

# --- What app this is ------------------------------------------------------
image:
  repository: 409178193343.dkr.ecr.us-west-2.amazonaws.com/python-demo-for-dashboard
  tag: latest            # <--- Updated by CI!  (pin a SHA when you tackle
                         #      rollbacks / strategies)
service:
  port: 80               # the port Kong connects to
  targetPort: 5000       # the port the app listens on inside the container

# --- PROD scaling ----------------------------------------------------------
replicaCount: 3           # PROD runs bigger than DEV (2)

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

# --- HA helper -------------------------------------------------------------
# PROD keeps at least 1 pod up even if a node gets drained:
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# --- Health probes ---------------------------------------------------------
# OFF until you confirm the app's real health path (wrong path = CrashLoop):
# probes:
#   enabled: true
#   liveness:
#     path: /healthz
#   readiness:
#     path: /healthz

# --- Kong route (Gateway API / HTTPRoute) ----------------------------------
# The HTTPRoute tells Kong: "host X → this app's ClusterIP service".
route:
  enabled: true
  host: python-demo-for-dashboard-prod.tyagi.fun
  path: /

# --- Optional autoscaling (needs metrics-server installed) -----------------
# autoscaling:
#   enabled: true
#   minReplicas: 3
#   maxReplicas: 10
#   targetCPUUtilizationPercentage: 70

# --- Optional env vars / secrets -------------------------------------------
# envFrom:                    # pull a whole k8s Secret (e.g. ESO-managed) later
#   - secretRef:
#       name: python-app-db