# ============================================================================
# python-app  —  DEV  overrides
# Base defaults come from  helm/values.yaml ; this file only overrides what
# differs for python-app in DEV. ArgoCD merges: base → this file.
# ============================================================================

# --- What app this is ------------------------------------------------------
image:
  repository: 409178193343.dkr.ecr.us-west-2.amazonaws.com/python-demo-for-dashboard
  tag: cfed3dde5d3966efcf6909e02cc1eccd86015130
service:
  port: 80               # the port Kong connects to
  targetPort: 5000       # the port the app listens on inside the container

# --- DEV scaling -----------------------------------------------------------
replicaCount: 2

# --- Deployment strategy ----------------------------------------------------
# Empty strategy uses a standard Kubernetes Deployment.
# Set bluegreen or canary only after Argo Rollouts is intentionally enabled.
strategy: ""

# These knobs are ignored while using a standard Deployment.
blueGreen:
  autoPromotionEnabled: true
  scaleDownDelaySeconds: 60

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# --- Health probes ---------------------------------------------------------
# ON — the app has a real /health endpoint (returns {"status": "ok"}).
# Argo Rollouts NEEDS these: it only promotes when preview pods are Ready.
probes:
  enabled: true
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# --- Kong route (Gateway API / HTTPRoute) ----------------------------------
# The HTTPRoute tells Kong: "host X → this app's ClusterIP service".
route:
  enabled: true
  host: python-demo-for-dashboard-dev.tyagi.fun
  path: /

# --- Optional env vars / secrets -------------------------------------------
# env:
